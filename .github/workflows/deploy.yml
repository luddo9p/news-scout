name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy via SSH
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'DEPLOY'
          set -euo pipefail
          echo "=== Agent Scout Deploy ==="
          echo "Starting deployment at $(date)"

          if [ ! -d /opt/agent-scout ]; then
            echo "First-time setup: cloning repository..."
            git clone https://github.com/${{ github.repository }}.git /opt/agent-scout
            cd /opt/agent-scout
          else
            cd /opt/agent-scout
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
          fi

          echo "Installing dependencies..."
          npm ci

          echo "Building TypeScript..."
          npm run build

          echo "Rebuilding and restarting Docker containers..."
          docker compose up -d --build

          echo "Running health check..."
          HEALTHY=0
          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "Health check passed!"
              HEALTHY=1
              break
            fi
            echo "Waiting for api-bridge... (attempt $i/5)"
            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "ERROR: Health check failed after 5 attempts"
            exit 1
          fi

          echo "=== Post-deploy run: one real digest per pipeline ==="
          # Real emails are sent on purpose: this is the deploy-time proof that sources,
          # bridge and model work end to end. Sources are external and flaky, so a
          # failed agent warns and logs instead of failing the deployment. The 420s
          # bound is just above the synthesizer's own 300s timeout.
          for AGENT in tech-ai bourse-scout; do
            echo "--- ${AGENT} ---"
            if timeout 420 npm start --silent -- "--agent=${AGENT}"; then
              echo "${AGENT}: run completed"
            else
              echo "::warning::Agent ${AGENT} failed during the post-deploy run"
            fi
          done

          echo "=== Deploy complete at $(date) ==="
          DEPLOY